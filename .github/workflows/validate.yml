name: Validate
on: [push, pull_request]
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/DomainTests/DomainTests.csproj
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: |
          curl -fL https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_mono_linux_x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          dotnet build
          /tmp/godot/Godot_v4.4.1-stable_mono_linux_x86_64/Godot_v4.4.1-stable_mono_linux.x86_64 --headless --path . --editor --quit
          /tmp/godot/Godot_v4.4.1-stable_mono_linux_x86_64/Godot_v4.4.1-stable_mono_linux.x86_64 --headless --path . --quit-after 5
      - run: /tmp/godot/Godot_v4.4.1-stable_mono_linux_x86_64/Godot_v4.4.1-stable_mono_linux.x86_64 --headless --path . --script res://tests/ui_smoke.gd
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/opengds2-ui-smoke
          OPENGDS2_UI_TEST_SAVE: '1'
      - run: /tmp/godot/Godot_v4.4.1-stable_mono_linux_x86_64/Godot_v4.4.1-stable_mono_linux.x86_64 --headless --fixed-fps 60 --path . --script res://tests/core_loop_smoke.gd
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/opengds2-core-loop-smoke
  desktop:
    runs-on: ubuntu-latest
    needs: [domain, godot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned Godot .NET editor and templates
        run: |
          curl --retry 3 -fL https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_mono_linux_x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl --retry 3 -fL https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_mono_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable.mono"
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable.mono/"
      - name: Export community desktop builds
        run: |
          mkdir -p builds/linux builds/windows /tmp/opengds2-notices
          GODOT_EXPORT=/tmp/godot/Godot_v4.4.1-stable_mono_linux_x86_64/Godot_v4.4.1-stable_mono_linux.x86_64
          "$GODOT_EXPORT" --headless --path . --export-release "Linux Desktop" builds/linux/OpenGDS2.x86_64
          "$GODOT_EXPORT" --headless --path . --export-release "Windows Desktop" builds/windows/OpenGDS2.exe
          "$GODOT_EXPORT" --headless --path . --script res://tools/export_licenses.gd -- /tmp/opengds2-notices
      - name: Run exported Linux title and full core-loop fixture outside the checkout
        run: |
          mkdir -p /tmp/opengds2-export-run
          cd /tmp/opengds2-export-run
          "$GITHUB_WORKSPACE/builds/linux/OpenGDS2.x86_64" --headless --quit-after 5
          "$GITHUB_WORKSPACE/builds/linux/OpenGDS2.x86_64" --headless --fixed-fps 60 --script "$GITHUB_WORKSPACE/tests/core_loop_smoke.gd"
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/opengds2-export-smoke
      - name: Package binaries, notices and checksums
        run: |
          python3 tools/package_desktop.py --export builds/linux --platform linux --notices /tmp/opengds2-notices --output builds/OpenGDS2-linux-x86_64.zip
          python3 tools/package_desktop.py --export builds/windows --platform windows --notices /tmp/opengds2-notices --output builds/OpenGDS2-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGDS2-desktop-development
          path: builds/*.zip
          if-no-files-found: error
          retention-days: 14
