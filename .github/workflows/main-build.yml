name: Build merged main
# Export packages only after a same-repository develop PR is merged into main.
# Ordinary source validation stays in fidelity-validation.yml.
on:
  pull_request:
    branches: [main]
    types: [closed]
permissions:
  contents: read
concurrency:
  group: main-build-${{ github.event.pull_request.merge_commit_sha }}
  cancel-in-progress: false
jobs:
  domain:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/DomainTests/DomainTests.csproj
      - run: python3 -m pip install -r requirements-tools.txt
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
  godot:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: |
          curl -fL https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_mono_linux_x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          dotnet build
          /tmp/godot/Godot_v4.4.1-stable_mono_linux_x86_64/Godot_v4.4.1-stable_mono_linux.x86_64 --headless --path . --import
          /tmp/godot/Godot_v4.4.1-stable_mono_linux_x86_64/Godot_v4.4.1-stable_mono_linux.x86_64 --headless --path . --quit-after 5
      - run: /tmp/godot/Godot_v4.4.1-stable_mono_linux_x86_64/Godot_v4.4.1-stable_mono_linux.x86_64 --headless --path . --script res://tests/ui_smoke.gd
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/opengds2-ui-smoke
          OPENGDS2_UI_TEST_SAVE: '1'
      - run: /tmp/godot/Godot_v4.4.1-stable_mono_linux_x86_64/Godot_v4.4.1-stable_mono_linux.x86_64 --headless --fixed-fps 60 --path . --script res://tests/core_loop_smoke.gd
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/opengds2-core-loop-smoke
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [domain, godot]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned Godot .NET editor and templates
        run: |
          curl --retry 3 -fL https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_mono_linux_x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl --retry 3 -fL https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_mono_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable.mono"
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable.mono/"
      - name: Configure Windows executable icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine64
          curl --retry 3 -fL https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -o /tmp/rcedit-x64.exe
          echo '3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a  /tmp/rcedit-x64.exe' | sha256sum --check
          mkdir -p "$HOME/.config/godot"
          python3 - <<'PYICON'
          from pathlib import Path
          settings=Path.home()/'.config/godot/editor_settings-4.4.tres'
          settings.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/windows/rcedit = "/tmp/rcedit-x64.exe"\nexport/windows/wine = "/usr/lib/wine/wine64"\n')
          PYICON
      - name: Export community desktop builds
        run: |
          set -euo pipefail
          mkdir -p builds/linux builds/windows builds/windows32 builds/linux-debug builds/windows-debug /tmp/opengds2-notices
          GODOT_EXPORT=/tmp/godot/Godot_v4.4.1-stable_mono_linux_x86_64/Godot_v4.4.1-stable_mono_linux.x86_64
          "$GODOT_EXPORT" --headless --path . --export-release "Linux Desktop" builds/linux/OpenGDS2.x86_64 2>&1 | tee /tmp/linux-export.log
          if rg '^ERROR:' /tmp/linux-export.log; then exit 1; fi
          "$GODOT_EXPORT" --headless --path . --export-release "Windows Desktop" builds/windows/OpenGDS2.exe 2>&1 | tee /tmp/windows-export.log
          if rg '^ERROR:' /tmp/windows-export.log; then exit 1; fi
          "$GODOT_EXPORT" --headless --path . --export-release "Windows Desktop 32-bit" builds/windows32/OpenGDS2.exe 2>&1 | tee /tmp/windows32-export.log
          if rg '^ERROR:' /tmp/windows32-export.log; then exit 1; fi
          "$GODOT_EXPORT" --headless --path . --export-debug "Linux Debug" builds/linux-debug/OpenGDS2.x86_64 2>&1 | tee /tmp/linux-debug-export.log
          if rg '^ERROR:' /tmp/linux-debug-export.log; then exit 1; fi
          "$GODOT_EXPORT" --headless --path . --export-debug "Windows Debug" builds/windows-debug/OpenGDS2.exe 2>&1 | tee /tmp/windows-debug-export.log
          if rg '^ERROR:' /tmp/windows-debug-export.log; then exit 1; fi
          "$GODOT_EXPORT" --headless --path . --script res://tools/export_licenses.gd -- /tmp/opengds2-notices
      - name: Package binaries, notices and checksums
        run: |
          python3 tools/package_desktop.py --export builds/linux --platform linux --notices /tmp/opengds2-notices --output builds/OpenGDS2-linux-x86_64.zip
          python3 tools/package_desktop.py --export builds/windows --platform windows --notices /tmp/opengds2-notices --early-access --source-commit "${{ github.event.pull_request.merge_commit_sha }}" --report-url https://github.com/UnSpotibleShadow/OpenGDS2/issues --output builds/OpenGDS_v0.1.0-ea.2_x86_64.zip
          python3 tools/package_desktop.py --export builds/windows32 --platform windows --notices /tmp/opengds2-notices --early-access --source-commit "${{ github.event.pull_request.merge_commit_sha }}" --report-url https://github.com/UnSpotibleShadow/OpenGDS2/issues --output builds/OpenGDS_v0.1.0-ea.2_x86_32.zip
          python3 tools/package_desktop.py --export builds/linux-debug --platform linux --configuration debug --notices /tmp/opengds2-notices --output builds/OpenGDS2-linux-x86_64-debug.zip
          python3 tools/package_desktop.py --export builds/windows-debug --platform windows --configuration debug --notices /tmp/opengds2-notices --output builds/OpenGDS2-windows-x86_64-debug.zip
          for package in builds/*.zip; do
            (cd builds && sha256sum "$(basename "$package")") > "$package.sha256"
          done
      - name: Run packaged Linux release and debug core loops outside the checkout
        run: |
          mkdir -p /tmp/opengds2-export-run
          unzip -q builds/OpenGDS2-linux-x86_64.zip -d /tmp/opengds2-export-run
          cd /tmp/opengds2-export-run
          ./OpenGDS2-linux-x86_64/OpenGDS2.x86_64 --headless --quit-after 5
          OPENGDS2_EXPECT_DEBUG=0 ./OpenGDS2-linux-x86_64/OpenGDS2.x86_64 --headless --fixed-fps 60 --script "$GITHUB_WORKSPACE/tests/core_loop_smoke.gd"
          unzip -q "$GITHUB_WORKSPACE/builds/OpenGDS2-linux-x86_64-debug.zip" -d /tmp/opengds2-export-run
          ./OpenGDS2-linux-x86_64-debug/OpenGDS2.x86_64 --headless --quit-after 5
          OPENGDS2_EXPECT_DEBUG=1 ./OpenGDS2-linux-x86_64-debug/OpenGDS2.x86_64 --headless --fixed-fps 60 --script "$GITHUB_WORKSPACE/tests/core_loop_smoke.gd"
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/opengds2-export-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGDS2-desktop-${{ github.event.pull_request.merge_commit_sha }}
          path: |
            builds/OpenGDS2-linux-x86_64.zip
            builds/OpenGDS2-linux-x86_64.zip.sha256
            builds/OpenGDS_v0.1.0-ea.2_x86_64.zip
            builds/OpenGDS_v0.1.0-ea.2_x86_64.zip.sha256
            builds/OpenGDS_v0.1.0-ea.2_x86_32.zip
            builds/OpenGDS_v0.1.0-ea.2_x86_32.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGDS2-desktop-debug-${{ github.event.pull_request.merge_commit_sha }}
          path: |
            builds/OpenGDS2-linux-x86_64-debug.zip
            builds/OpenGDS2-linux-x86_64-debug.zip.sha256
            builds/OpenGDS2-windows-x86_64-debug.zip
            builds/OpenGDS2-windows-x86_64-debug.zip.sha256
          if-no-files-found: error
          retention-days: 14
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: OpenGDS2-desktop-${{ github.event.pull_request.merge_commit_sha }}
          path: ${{ runner.temp }}/opengds2-desktop
      - uses: actions/download-artifact@v4
        with:
          name: OpenGDS2-desktop-debug-${{ github.event.pull_request.merge_commit_sha }}
          path: ${{ runner.temp }}/opengds2-desktop
      - name: Run both packaged Windows architectures and debug core loop
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "opengds2-desktop"
          $fixture = Join-Path $env:GITHUB_WORKSPACE "tests/core_loop_smoke.gd"
          $cases = @(
            @{ Zip = "OpenGDS_v0.1.0-ea.2_x86_32"; Root = "OpenGDS2-windows-0.1.0-ea.2"; Debug = "0" },
            @{ Zip = "OpenGDS_v0.1.0-ea.2_x86_64"; Root = "OpenGDS2-windows-0.1.0-ea.2"; Debug = "0" },
            @{ Zip = "OpenGDS2-windows-x86_64-debug"; Root = "OpenGDS2-windows-x86_64-debug"; Debug = "1" }
          )
          foreach ($case in $cases) {
            $runRoot = Join-Path $env:RUNNER_TEMP $case.Zip
            Expand-Archive -Path (Join-Path $packageRoot "$($case.Zip).zip") -DestinationPath $runRoot
            $game = Join-Path $runRoot "$($case.Root)/OpenGDS2.console.exe"
            Set-Location $runRoot
            $env:APPDATA = Join-Path $runRoot "profile"
            $env:OPENGDS2_EXPECT_DEBUG = $case.Debug
            & $game --headless --quit-after 5
            if ($LASTEXITCODE -ne 0) { throw "Packaged Windows startup failed: $LASTEXITCODE ($($case.Zip))" }
            & $game --headless --fixed-fps 60 --script $fixture
            if ($LASTEXITCODE -ne 0) { throw "Packaged Windows core loop failed: $LASTEXITCODE ($($case.Zip))" }
          }
